<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow · 任务管理看板</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-mark">
                        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                            <rect x="2" y="2" width="10" height="10" rx="3" fill="#6E56CF"/>
                            <rect x="16" y="2" width="10" height="10" rx="3" fill="#8B7AE0" opacity="0.5"/>
                            <rect x="2" y="16" width="10" height="10" rx="3" fill="#8B7AE0" opacity="0.5"/>
                            <rect x="16" y="16" width="10" height="10" rx="3" fill="#6E56CF"/>
                        </svg>
                    </div>
                    <span class="logo-text">TaskFlow</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-label">工作区</div>
                    <a class="nav-item active">
                        <span class="nav-icon">▦</span>
                        <span>我的看板</span>
                        <span class="nav-count" id="totalCount">0</span>
                    </a>
                    <a class="nav-item">
                        <span class="nav-icon">★</span>
                        <span>收藏</span>
                    </a>
                    <a class="nav-item">
                        <span class="nav-icon">◷</span>
                        <span>最近</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">视图</div>
                    <a class="nav-item" data-filter="all">
                        <span class="nav-dot dot-all"></span>
                        <span>全部任务</span>
                    </a>
                    <a class="nav-item" data-filter="urgent">
                        <span class="nav-dot dot-urgent"></span>
                        <span>紧急</span>
                    </a>
                    <a class="nav-item" data-filter="high">
                        <span class="nav-dot dot-high"></span>
                        <span>高优先级</span>
                    </a>
                    <a class="nav-item" data-filter="overdue">
                        <span class="nav-dot dot-overdue"></span>
                        <span>已逾期</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="stat-card">
                    <div class="stat-row">
                        <span class="stat-label">完成率</span>
                        <span class="stat-value" id="completionRate">0%</span>
                    </div>
                    <div class="stat-bar">
                        <div class="stat-bar-fill" id="completionBar"></div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main">
            <!-- 顶栏 -->
            <header class="topbar">
                <div class="topbar-left">
                    <h1 class="page-title">我的看板</h1>
                    <span class="breadcrumb-sep">/</span>
                    <span class="breadcrumb-current">全部任务</span>
                </div>
                <div class="topbar-right">
                    <div class="search-box">
                        <span class="search-icon">⌕</span>
                        <input type="text" id="searchInput" placeholder="搜索任务..." autocomplete="off">
                        <kbd>⌘K</kbd>
                    </div>
                    <button class="btn-icon" id="themeToggle" title="切换主题">
                        <span>☾</span>
                    </button>
                    <button class="btn-primary" id="addTaskBtn">
                        <span class="btn-plus">+</span>
                        <span>新建任务</span>
                    </button>
                </div>
            </header>

            <!-- 看板区域 -->
            <div class="board" id="board">
                <div class="column" data-column="todo">
                    <div class="column-header">
                        <div class="column-title">
                            <span class="column-dot dot-todo"></span>
                            <span>待办</span>
                            <span class="column-count">0</span>
                        </div>
                        <button class="column-add" data-column="todo" title="添加任务">+</button>
                    </div>
                    <div class="column-body" data-column="todo"></div>
                </div>

                <div class="column" data-column="progress">
                    <div class="column-header">
                        <div class="column-title">
                            <span class="column-dot dot-progress"></span>
                            <span>进行中</span>
                            <span class="column-count">0</span>
                        </div>
                        <button class="column-add" data-column="progress" title="添加任务">+</button>
                    </div>
                    <div class="column-body" data-column="progress"></div>
                </div>

                <div class="column" data-column="review">
                    <div class="column-header">
                        <div class="column-title">
                            <span class="column-dot dot-review"></span>
                            <span>审核中</span>
                            <span class="column-count">0</span>
                        </div>
                        <button class="column-add" data-column="review" title="添加任务">+</button>
                    </div>
                    <div class="column-body" data-column="review"></div>
                </div>

                <div class="column" data-column="done">
                    <div class="column-header">
                        <div class="column-title">
                            <span class="column-dot dot-done"></span>
                            <span>已完成</span>
                            <span class="column-count">0</span>
                        </div>
                        <button class="column-add" data-column="done" title="添加任务">+</button>
                    </div>
                    <div class="column-body" data-column="done"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 任务编辑模态框 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="taskModal">
            <div class="modal-header">
                <h2 id="modalTitle">新建任务</h2>
                <button class="modal-close" id="modalClose">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" id="taskTitle" placeholder="输入任务标题..." maxlength="100">
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="taskDesc" placeholder="添加详细描述..." rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>优先级</label>
                        <div class="priority-picker" id="priorityPicker">
                            <button class="priority-btn" data-priority="low">
                                <span class="p-dot p-low"></span>低
                            </button>
                            <button class="priority-btn" data-priority="medium">
                                <span class="p-dot p-medium"></span>中
                            </button>
                            <button class="priority-btn active" data-priority="high">
                                <span class="p-dot p-high"></span>高
                            </button>
                            <button class="priority-btn" data-priority="urgent">
                                <span class="p-dot p-urgent"></span>紧急
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>截止日期</label>
                        <input type="date" id="taskDue">
                    </div>
                </div>
                <div class="form-group">
                    <label>标签</label>
                    <div class="tag-input-wrap">
                        <div class="tag-list" id="tagList"></div>
                        <input type="text" id="tagInput" placeholder="输入标签后回车...">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-ghost" id="modalDelete" style="margin-right:auto;display:none;">删除任务</button>
                <button class="btn-ghost" id="modalCancel">取消</button>
                <button class="btn-primary" id="modalSave">保存</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
